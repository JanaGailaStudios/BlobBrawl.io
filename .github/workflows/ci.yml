name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Server + client tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Integration tests (real Socket.IO clients, authoritative engine)
        run: npm test
        env:
          NODE_OPTIONS: --no-warnings
      - name: Headless client tests (jsdom + esbuild)
        run: npm run test:client
      - name: End-to-end tests (real client vs. real server)
        run: npm run test:e2e
        env:
          NODE_OPTIONS: --no-warnings
